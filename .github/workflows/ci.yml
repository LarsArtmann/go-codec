name: CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: Test (JSON ${{ matrix.json-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-mode: [v1, v2]
    env:
      GOEXPERIMENT: ${{ matrix.json-mode == 'v2' && 'jsonv2' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -race -count=1

  lint:
    name: Lint (JSON ${{ matrix.json-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-mode: [v1, v2]
    env:
      GOEXPERIMENT: ${{ matrix.json-mode == 'v2' && 'jsonv2' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run --timeout 5m ${{ matrix.json-mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }}

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
