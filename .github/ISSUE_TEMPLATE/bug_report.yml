name: Bug Report
description: Report a bug in go-codec
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the bug.
      placeholder: |
        ```go
        // code here
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go1.26.5"
    validations:
      required: true
  - type: dropdown
    id: json-mode
    attributes:
      label: JSON mode
      options:
        - v1 (default)
        - v2 (GOEXPERIMENT=jsonv2)
        - Both
    validations:
      required: true
