name: CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (JSON ${{ matrix.json-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-mode: [v1, v2]
    env:
      GOEXPERIMENT: ${{ matrix.json-mode == 'v2' && 'jsonv2' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./... -race -count=1
      - name: Coverage summary
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: FEATURES.md drift check (PLANNED symbols must not resolve)
        if: matrix.json-mode == 'v1'
        run: bash scripts/check-features-planned.sh
      - name: Go version single-source check (declarations must agree)
        if: matrix.json-mode == 'v1'
        run: bash scripts/check-go-version.sh
      - name: Error-code registry drift check (source and docs must agree)
        if: matrix.json-mode == 'v1'
        run: bash scripts/check-error-codes.sh
      - name: erraudit pin consistency check (ci.yml and flake.nix must agree)
        if: matrix.json-mode == 'v1'
        run: bash scripts/check-erraudit-version.sh
      - name: golangci-lint pin floor check (pin must be >= known-good floor)
        if: matrix.json-mode == 'v1'
        run: bash scripts/check-golangci-pin.sh

  lint:
    name: Lint (JSON ${{ matrix.json-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-mode: [v1, v2]
    env:
      GOEXPERIMENT: ${{ matrix.json-mode == 'v2' && 'jsonv2' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: golangci-lint run --timeout 5m ${{ matrix.json-mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }}
      - name: Produce lint JSON report
        if: always()
        run: golangci-lint run --timeout 5m ${{ matrix.json-mode == 'v2' && '--build-tags goexperiment.jsonv2' || '' }} --output.json.path lint-report.json
        shell: bash
      - name: Validate lint JSON report
        if: always()
        run: jq -e . lint-report.json > /dev/null
      - name: Upload lint JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report-json-${{ matrix.json-mode }}
          path: lint-report.json
          retention-days: 14

  error-audit:
    name: Error Audit (erraudit)
    runs-on: ubuntu-latest
    env:
      HAS_ERRAUDIT_PAT: ${{ secrets.ERRAUDIT_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install erraudit
        if: env.HAS_ERRAUDIT_PAT == 'true'
        env:
          GOPRIVATE: github.com/larsartmann/*
          GOEXPERIMENT: jsonv2
        run: |
          git config --global url."https://x-access-token:${{ secrets.ERRAUDIT_PAT }}@github.com/".insteadOf "https://github.com/"
          go install github.com/larsartmann/erraudit/cmd/erraudit@v0.7.0
      - name: "Skipped: ERRAUDIT_PAT secret not set"
        if: env.HAS_ERRAUDIT_PAT != 'true'
        run: echo "erraudit is a private module (no proxy artifact). Add an ERRAUDIT_PAT secret with read access to github.com/larsartmann/erraudit to enable this gate."
      - name: Enforce go-error-family error policy
        if: env.HAS_ERRAUDIT_PAT == 'true'
        run: |
          erraudit lint ./... --enforce-go-error-family --type-aware
          # Zero-baselines: keep the legacy patterns from regressing silently.
          # (legacy_as/legacy_is must stay at 0 findings; no //nolint:legacyerrors
          # suppressions either.)
          erraudit lint ./... --type legacy_as
          erraudit lint ./... --type legacy_is
          ! grep -rn 'nolint:legacyerrors' --include='*.go' .

  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -color

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mermaid:
    name: Docs Diagram Render (mermaid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Cache mermaid-cli and its Chromium download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/puppeteer
          key: mermaid-cli-11.17.0-node24
      - name: Render all mermaid blocks in README.md
        run: |
          set -euo pipefail
          awk '
            /^```mermaid$/ { in_block=1; n++; file=sprintf("/tmp/mermaid-%d.mmd", n); next }
            /^```$/        { in_block=0; next }
            in_block       { print > file }
          ' README.md
          count=$(find /tmp -maxdepth 1 -name 'mermaid-*.mmd' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "FAIL: no mermaid blocks found in README.md" >&2
            exit 1
          fi
          echo '{ "args": ["--no-sandbox"] }' > /tmp/puppeteer-config.json
          for f in /tmp/mermaid-*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.17.0 -p /tmp/puppeteer-config.json -i "$f" -o "${f%.mmd}.svg" > /dev/null
            echo "ok: rendered $f"
          done
          echo "mermaid: PASS ($count diagram(s) rendered)"

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz:
    name: Fuzz (JSON ${{ matrix.json-mode }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json-mode: [v1, v2]
    env:
      GOEXPERIMENT: ${{ matrix.json-mode == 'v2' && 'jsonv2' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz targets
        run: |
          if [ "${{ matrix.json-mode }}" = "v1" ]; then
            targets=(
              FuzzJSONCodec_Roundtrip
              FuzzCBORCodec_Roundtrip
              FuzzRawCodec_Passthrough
              FuzzCBORCodec_Determinism
              FuzzCBORCodec_DecodeNeverPanics
              FuzzJSONCodec_TypedRoundtrip
              FuzzCBORCodec_TypedRoundtrip
              FuzzCBORCodec_CanonicalFidelity
              FuzzAutoDetectDebug_Consistency
              FuzzNormalizeForJSON
              FuzzTranscodeToJSON
              FuzzStreamingJSON_NDJSONRoundtrip
              FuzzObservableCodec_HookSafety
            )
          else
            targets=(
              FuzzJSONCodec_Roundtrip
              FuzzCBORCodec_Roundtrip
              FuzzRawCodec_Passthrough
              FuzzCBORCodec_Determinism
              FuzzCBORCodec_DecodeNeverPanics
              FuzzJSONCodec_TypedRoundtrip
              FuzzCBORCodec_TypedRoundtrip
              FuzzCBORCodec_CanonicalFidelity
              FuzzAutoDetectDebug_Consistency
              FuzzTranscodeToJSON
              FuzzStreamingJSON_NDJSONRoundtrip
              FuzzObservableCodec_HookSafety
            )
          fi

          for target in "${targets[@]}"; do
            echo "=== Fuzzing $target (JSON ${{ matrix.json-mode }}) ==="
            go test ./... -run='^$' -fuzz="$target" -fuzztime=30s
          done
      - name: Upload fuzz corpus
        # Policy: artifact-only. The weekly cron uploads the generated corpus so
        # maintainers can review and PR valuable new seeds; it does NOT auto-commit
        # back to the repository. See testdata/fuzz/README.md for the rationale and
        # the manual seed-add workflow.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.json-mode }}
          path: testdata/fuzz
          retention-days: 7

  bench:
    name: Benchmarks (self-relative regression gate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmark suite (v1 mode, count=10)
        run: env -u GOEXPERIMENT go test -run '^$' -bench . -benchmem -count=10 -timeout 40m | tee bench-current.txt
      - name: Fetch previous successful bench artifact
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "found=false" >> "$GITHUB_OUTPUT"
          prev_ids=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=10" --jq '.workflow_runs[].id' || true)
          for id in $prev_ids; do
            if [ "$id" = "${{ github.run_id }}" ]; then continue; fi
            if gh run download "$id" -n bench-results -O bench-previous.txt 2>/dev/null && [ -s bench-previous.txt ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "baseline: artifact bench-results from run $id"
              break
            fi
          done
      - name: Compare against previous run (self-relative)
        if: steps.prev.outputs.found == 'true'
        run: |
          python3 scripts/bench-compare.py bench-previous.txt bench-current.txt | tee bench-compare.txt
      - name: First-run note (seeds the comparison chain)
        if: steps.prev.outputs.found != 'true'
        run: echo "no previous bench artifact found - this run seeds the self-relative chain; the next scheduled run compares against it"
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: |
            bench-current.txt
            bench-compare.txt
          retention-days: 90
          if-no-files-found: ignore

  summary:
    name: Gate Summary
    needs:
      - test
      - lint
      - error-audit
      - workflow-lint
      - secret-scan
      - mermaid
      - vulncheck
      - fuzz
      - bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render per-gate results into the job summary
        env:
          R_TEST: ${{ needs.test.result }}
          R_LINT: ${{ needs.lint.result }}
          R_ERROR_AUDIT: ${{ needs.error-audit.result }}
          R_WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          R_SECRET_SCAN: ${{ needs.secret-scan.result }}
          R_MERMAID: ${{ needs.mermaid.result }}
          R_VULNCHECK: ${{ needs.vulncheck.result }}
          R_FUZZ: ${{ needs.fuzz.result }}
          R_BENCH: ${{ needs.bench.result }}
        run: |
          {
            echo "## CI gate summary"
            echo ""
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Test (v1 + v2 matrix) | $R_TEST |"
            echo "| Lint (v1 + v2 matrix) | $R_LINT |"
            echo "| Error Audit (erraudit) | $R_ERROR_AUDIT |"
            echo "| Workflow Lint (actionlint) | $R_WORKFLOW_LINT |"
            echo "| Secret Scan (gitleaks) | $R_SECRET_SCAN |"
            echo "| Docs Diagram Render (mermaid) | $R_MERMAID |"
            echo "| Vulnerability Scan (govulncheck) | $R_VULNCHECK |"
            echo "| Fuzz (schedule/dispatch only) | $R_FUZZ |"
            echo "| Benchmarks (schedule/dispatch only) | $R_BENCH |"
            echo ""
            echo "skipped = gate did not run for this event (fuzz/bench run on schedule and workflow_dispatch only; error-audit waits for the ERRAUDIT_PAT secret)."
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for r in "$R_TEST" "$R_LINT" "$R_VULNCHECK" "$R_WORKFLOW_LINT" "$R_SECRET_SCAN" "$R_MERMAID"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more always-on gates failed - see the table above." >&2
            exit 1
          fi
